# =============================================================================
# CBP Training Assistant — Docker Compose Orchestration
#
# Services:
#   1. postgres     — PostgreSQL 15 (relational database)
#   2. qdrant       — Qdrant vector database (local instance)
#   3. ollama       — Ollama LLM server (local instance)
#   4. backend      — Django 5 + Daphne (ASGI) + RAG pipeline
#   5. frontend     — React 19 built assets served by Nginx
#   6. nginx        — Reverse proxy (unified entry point)
#
# Local models (pre-downloaded, mounted from ./models):
#   - Dense embeddings:  nomic-embed-text-v1.5 (FastEmbed/ONNX)
#   - Sparse embeddings: Qdrant/bm25 (FastEmbed)
#   - LLM:               gemma4:latest (Ollama)
#
# Usage:
#   1. Download embedding models: python download_models.py
#   2. Download Ollama model:     python download_ollama_model.py
#   3. Start services:            docker compose up -d --build
#   4. View logs:                 docker compose logs -f backend
#   5. Stop services:             docker compose down -v
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # PostgreSQL 15 — Relational Database
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: cbp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB_NAME:-cbp_db}
      POSTGRES_USER: ${PG_DB_USER:-cbp_user}
      POSTGRES_PASSWORD: ${PG_DB_PASSWORD:-cbp_pass}
    ports:
      - "${PG_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DB_USER:-cbp_user} -d ${PG_DB_NAME:-cbp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cbp-net

  # -------------------------------------------------------------------------
  # Qdrant — Vector Database (Local Instance)
  # -------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.17
    container_name: cbp-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_EXTERNAL_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - cbp-net

  # -------------------------------------------------------------------------
  # Ollama — Local LLM Server
  # -------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: cbp-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_EXTERNAL_PORT:-11434}:11434"
    volumes:
      - ./models/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - cbp-net

  # -------------------------------------------------------------------------
  # Backend — Django 5 + Daphne (ASGI) + Local Embeddings
  # -------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cbp-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - qdrant
      - ollama
    environment:
      # Django
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production-use-a-long-random-string}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}

      # PostgreSQL (service name = hostname inside Docker network)
      PG_DB_NAME: ${PG_DB_NAME:-cbp_db}
      PG_DB_USER: ${PG_DB_USER:-cbp_user}
      PG_DB_PASSWORD: ${PG_DB_PASSWORD:-cbp_pass}
      PG_DB_HOST: postgres
      PG_DB_PORT: "5432"

      # Qdrant (local container)
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-cbp_training}

      # Local embedding models via FastEmbed (mounted from ./models)
      MODELS_DIR: /app/models
      DENSE_MODEL_NAME: ${DENSE_MODEL_NAME:-nomic-ai/nomic-embed-text-v1.5}
      SPARSE_MODEL_NAME: ${SPARSE_MODEL_NAME:-Qdrant/bm25}
      DENSE_EMBEDDING_DIM: ${DENSE_EMBEDDING_DIM:-768}
      MRL_EMBEDDING_DIM: ${MRL_EMBEDDING_DIM:-256}
      USE_MRL: ${USE_MRL:-true}

      # Ollama (local container)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:latest}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8001}:8001"
    networks:
      - cbp-net

  # -------------------------------------------------------------------------
  # Frontend — React 19 + Nginx (static serve)
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: cbp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-3000}:3000"
    networks:
      - cbp-net

  # -------------------------------------------------------------------------
  # Nginx Reverse Proxy — Unified Entry Point
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cbp-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cbp-net

# =============================================================================
# Volumes — Persistent Data
# =============================================================================
volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  cbp-net:
    driver: bridge
